# MySQL Database Configuration for PIP Management System
# Copy this to application.yml or use as profile: spring.profiles.active=mysql

spring:
  application:
    name: pip-management-backend
  
  # MySQL DataSource Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/pip_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4&useUnicode=true
    username: pip_user
    password: your_secure_password_here
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # HikariCP Connection Pool Configuration (Production-Ready)
    hikari:
      # Connection pool settings
      minimum-idle: 5                    # Minimum connections in pool
      maximum-pool-size: 20              # Maximum connections in pool
      auto-commit: true
      idle-timeout: 30000                # 30 seconds
      max-lifetime: 1800000              # 30 minutes
      connection-timeout: 30000          # 30 seconds
      connection-test-query: SELECT 1
      
      # Connection pool name for monitoring
      pool-name: PIPManagementHikariPool
      
      # Leak detection (useful for debugging)
      leak-detection-threshold: 60000    # 60 seconds
      
      # Performance settings
      cache-prep-stmts: true
      prep-stmt-cache-size: 250
      prep-stmt-cache-sql-limit: 2048
      use-server-prep-stmts: true
      use-local-session-state: true
      rewrite-batched-statements: true
      cache-result-set-metadata: true
      cache-server-configuration: true
      elide-set-auto-commits: true
      maintain-time-stats: false

  # JPA / Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # DDL mode: 
      # - 'none': No automatic schema management (use Flyway/Liquibase)
      # - 'validate': Validate schema on startup
      # - 'update': Update schema automatically (development only)
      # - 'create': Drop and create schema (development only)
      # - 'create-drop': Drop schema on shutdown (development only)
      ddl-auto: validate  # Use 'validate' in production, 'update' in development
      
    # Show SQL queries (disable in production)
    show-sql: false
    
    # Format SQL for readability
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        
        # Performance optimizations
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
          batch_versioned_data: true
        
        # Connection pool (if not using HikariCP)
        connection:
          provider_disables_autocommit: true
        
        # Query cache (optional, requires second-level cache)
        cache:
          use_second_level_cache: false
          use_query_cache: false

  # H2 Console (disable for MySQL)
  h2:
    console:
      enabled: false

# JWT Configuration
jwt:
  secret: your-super-secret-jwt-key-change-in-production-use-strong-random-key
  expiration: 604800000 # 7 days in milliseconds

# CORS Configuration
cors:
  allowed-origins: 
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:3000

# Logging Configuration
logging:
  level:
    com.pip: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG        # Set to DEBUG to see SQL queries
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # Set to TRACE to see parameter binding
    com.zaxxer.hikari: INFO         # HikariCP connection pool logging
