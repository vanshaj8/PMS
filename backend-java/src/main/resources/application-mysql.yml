# =====================================================
# MySQL Database Configuration for Spring Boot
# =====================================================
# To use this configuration, set active profile: mysql
# Command: java -jar app.jar --spring.profiles.active=mysql
# Or in application.yml: spring.profiles.active: mysql
# =====================================================

server:
  port: 8080

spring:
  application:
    name: pip-management-backend
  
  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/pip_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8mb4
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password_here}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # HikariCP Connection Pool Configuration
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      pool-name: PIPManagementHikariPool
      auto-commit: true
      connection-test-query: SELECT 1
  
  # JPA / Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate  # Use 'validate' in production, 'update' in development
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: false  # Set to true for debugging
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: false  # Set to true for performance monitoring
  
  # SQL Script Execution (Optional - for initial data)
  sql:
    init:
      mode: never  # Use 'always' to run schema.sql and data.sql on startup
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-change-in-production-min-256-bits}
  expiration: 604800000 # 7 days in milliseconds

# CORS Configuration
cors:
  allowed-origins: 
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:3000

# Logging Configuration
logging:
  level:
    com.pip: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG  # Set to DEBUG to see SQL queries
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # Set to TRACE to see parameter binding
    org.springframework.web: INFO
    com.zaxxer.hikari: INFO
