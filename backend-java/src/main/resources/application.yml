server:
  port: 8080

spring:
  application:
    name: performix-backend
  
  # MySQL DataSource Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/pip_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true
    username: root
    password: Vanshaj@8
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # HikariCP Connection Pool Configuration
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      pool-name: PerformixHikariPool
      leak-detection-threshold: 60000
  
  # JPA / Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none  # Use 'none' since schema is manually created and managed
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
  
  # H2 Console (disabled for MySQL)
  h2:
    console:
      enabled: false

jwt:
  secret: your-super-secret-jwt-key-change-in-production
  expiration: 604800000 # 7 days in milliseconds

cors:
  allowed-origins: 
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:3000

logging:
  level:
    com.pip: DEBUG
    org.springframework.security: DEBUG

