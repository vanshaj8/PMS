<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Growth arrow/trend -->
  <g transform="translate(10, 10)">
    <!-- Upward trending arrow representing growth -->
    <path d="M 5 25 L 15 5 L 25 25" 
          fill="none" 
          stroke="url(#logoGradient)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <path d="M 5 25 L 15 15 L 25 25" 
          fill="url(#logoGradient)" 
          opacity="0.3"/>
    <!-- Goal target circle -->
    <circle cx="15" cy="5" r="3" fill="url(#logoGradient)"/>
    <!-- Base line -->
    <line x1="3" y1="25" x2="27" y2="25" 
          stroke="url(#logoGradient)" 
          stroke-width="2" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Text: Performix -->
  <text x="45" y="30" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="24" 
        font-weight="700" 
        fill="url(#logoGradient)">
    Performix
  </text>
  
  <!-- Tagline -->
  <text x="45" y="42" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="10" 
        font-weight="400" 
        fill="#64748b">
    Where goals turn into growth
  </text>
</svg>

